<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Soft Night</title>
  <script src="./lib/aframe.min.js"></script>
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <a-scene
    fog="type: exponential; color: #0b0e17; density: 0.08"
    background="color: #0b0e17"
    renderer="antialias: true; colorManagement: true">

    <!-- Soft lighting -->
    <a-entity light="type: ambient; color: #1a2035; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; color: #3a4a6b; intensity: 0.4; castShadow: false" position="-4 6 2"></a-entity>

    <!-- Ground (barely visible through fog) -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="80"
      height="80"
      color="#0a0c14"
      material="roughness: 1; metalness: 0">
    </a-plane>

    <!-- Floating lanterns -->
    <a-entity id="lanterns">
      <a-sphere
        position="-3 1.2 -8"
        radius="0.18"
        color="#ffb347"
        material="emissive: #ff9f1c; emissiveIntensity: 1.4; opacity: 0.9; transparent: true"
        animation="property: position; to: -3 7 -8; dur: 18000; easing: linear; loop: true; delay: 0">
      </a-sphere>

      <a-sphere
        position="2.5 0.8 -11"
        radius="0.15"
        color="#ffcc66"
        material="emissive: #ffaa33; emissiveIntensity: 1.3; opacity: 0.85; transparent: true"
        animation="property: position; to: 2.5 6.5 -11; dur: 22000; easing: linear; loop: true; delay: 2000">
      </a-sphere>

      <a-sphere
        position="-1 1.5 -14"
        radius="0.2"
        color="#ffd27f"
        material="emissive: #ffb347; emissiveIntensity: 1.5; opacity: 0.9; transparent: true"
        animation="property: position; to: -1 8 -14; dur: 25000; easing: linear; loop: true; delay: 4500">
      </a-sphere>

      <a-sphere
        position="4 0.6 -9"
        radius="0.13"
        color="#ffc04d"
        material="emissive: #ff9f1c; emissiveIntensity: 1.2; opacity: 0.8; transparent: true"
        animation="property: position; to: 4 6.8 -9; dur: 19500; easing: linear; loop: true; delay: 7000">
      </a-sphere>

      <a-sphere
        position="-5 1 -12"
        radius="0.16"
        color="#ffb347"
        material="emissive: #ffaa33; emissiveIntensity: 1.35; opacity: 0.85; transparent: true"
        animation="property: position; to: -5 7.2 -12; dur: 21000; easing: linear; loop: true; delay: 1100">
      </a-sphere>
    </a-entity>

    <!-- Quiet fox-eared silhouette in the distance -->
    <a-entity position="0 0 -18" scale="1.1 1.1 1.1">
      <!-- Body -->
      <a-cylinder
        position="0 1.1 0"
        radius="0.35"
        height="1.4"
        color="#0a0a0f"
        material="roughness: 1">
      </a-cylinder>

      <!-- Head -->
      <a-sphere
        position="0 2.05 0"
        radius="0.32"
        color="#0a0a0f"
        material="roughness: 1">
      </a-sphere>

      <!-- Left ear -->
      <a-cone
        position="-0.22 2.45 0"
        radius-bottom="0.11"
        radius-top="0"
        height="0.38"
        rotation="0 0 -12"
        color="#0a0a0f"
        material="roughness: 1">
      </a-cone>

      <!-- Right ear -->
      <a-cone
        position="0.22 2.45 0"
        radius-bottom="0.11"
        radius-top="0"
        height="0.38"
        rotation="0 0 12"
        color="#0a0a0f"
        material="roughness: 1">
      </a-cone>
    </a-entity>

    <!-- Very slow, breathing camera -->
    <a-entity
      id="rig"
      position="0 1.6 4"
      animation="property: position; to: 0.3 1.65 3.7; dir: alternate; dur: 14000; easing: easeInOutSine; loop: true">
      <a-camera
        look-controls="enabled: false"
        wasd-controls="enabled: false"
        fov="55">
      </a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
